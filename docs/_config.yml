title: Revolt
description: >
  Reference documentation for Revolt, a deeply redesigned branch of the Rebol
  language, with every example tested against a current interpreter each time
  the site is built.

# Custom domain.  Must agree with docs/CNAME, and with the DNS CNAME record
# (revolt -> metaeducation.github.io) at the registrar.
url: "https://revolt.metaeducation.com"
baseurl: ""

# Same theme as needful.metaeducation.com.
# https://just-the-docs.com
remote_theme: just-the-docs/just-the-docs@v0.10.0

# "Revolt" look: black and white with dim grays, after rebolsource.net.
# Variables: _sass/color_schemes/revolt.scss.  Palette and fonts:
# _sass/custom/setup.scss (fonts loaded by _includes/head_custom.html).
# Everything decorative: _sass/custom/custom.scss.
color_scheme: revolt
favicon_ico: "/assets/images/favicon.ico"

# Callouts are monochrome; the "colors" here are mapped to grays by the
# color scheme (note: dark gray bar, tip: mid gray, warning: black).
callouts_level: quiet
callouts:
  note:
    title: Note
    color: purple
  tip:
    title: Tip
    color: blue
  warning:
    title: Warning
    color: red

enable_copy_code_button: true
back_to_top: true
back_to_top_text: "Back to top"

highlighter: rouge

# A fenced code block with no language named is Rebol, so pages don't have
# to say ```rebol on every example.  (Name a language to opt out: ```c,
# ```yaml, ```text.)  tools/extract-doctests.py and
# assets/js/revolt-console.js follow the same rule.
#
kramdown:
  syntax_highlighter_opts:
    default_lang: rebol

# Where the pencil "Edit page" link beside each page's title points
# (_includes/edit_link.html).  The theme's own "Edit this page on GitHub" link
# at the bottom of the page is turned off, since that one replaces it.
# !!! Repository name assumed; change if the repo lives elsewhere.
gh_edit_link: false
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/metaeducation/revolt-site"
gh_edit_branch: "main"
gh_edit_source: "docs"
gh_edit_view_mode: "edit"

# The console is copied into /console/ by the workflow after Jekyll runs
# (it lives in the replpad-js repository), so it is not a page Jekyll knows.
aux_links:
  "Console":
    - "/console/"
  "GitHub":
    - "https://github.com/metaeducation/revolt"
  "Forum":
    - "https://revolt.metaeducation.com/forum/"

plugins:
  - jekyll-sitemap

# The README.md in each content folder is for people working on the site.
# Without this, the Pages build turns each one into that folder's index
# page (the jekyll-readme-index plugin), and it shows up in the sidebar
# titled with its heading, e.g. "docs/natives".
#
exclude:
  - "*/README.md"
  - "concepts/README.md"
  - "datatypes/README.md"
  - "natives/README.md"

defaults:
  - scope:
      path: "README.md"
    values:
      sitemap: false

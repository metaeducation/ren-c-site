title: Ren-C
description: >
  Reference documentation for Ren-C, with every example tested against a
  current interpreter each time the site is built.

# !!! Set these when the custom domain is chosen (see README.md)
url: ""
baseurl: ""

# Same theme as needful.metaeducation.com.
# https://just-the-docs.com
remote_theme: just-the-docs/just-the-docs@v0.10.0

color_scheme: dark
callouts_level: loud
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: red

enable_copy_code_button: true
back_to_top: true
back_to_top_text: "Back to top"

highlighter: rouge

# "Edit this page on GitHub" link at the bottom of every page.
# !!! Repository name assumed; change if the repo lives elsewhere.
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/metaeducation/ren-c-site"
gh_edit_branch: "main"
gh_edit_source: "docs"
gh_edit_view_mode: "edit"

aux_links:
  "Ren-C on GitHub":
    - "https://github.com/metaeducation/ren-c"
  "Forum":
    - "https://rebol.metaeducation.com"

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: "README.md"
    values:
      sitemap: false

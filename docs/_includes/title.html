{%- comment -%}
  Overrides just-the-docs' _includes/title.html: the sidebar site title.
  The wordmark is REV[o]LT, with the mark (assets/images/revolt-mark.svg)
  standing in for the O.  Styled by .revolt-wordmark in
  _sass/custom/custom.scss.
{%- endcomment -%}
<span class="revolt-wordmark" role="img" aria-label="{{ site.title }}"><span aria-hidden="true">REV</span><img class="revolt-mark" src="{{ '/assets/images/revolt-mark.svg' | relative_url }}" alt="" width="64" height="64"><span aria-hidden="true">LT</span></span>
